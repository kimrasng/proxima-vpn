host: localhost:2053
info:
  contact: {}
  description: VPN Panel Management API
  title: Proxima VPN API
  version: 0.1.0
paths:
  /admin/activity:
    get:
      description: Returns the most recent recorded panel events, newest first. Supplying
        both target_type and target_id narrows the feed to that target.
      parameters:
      - description: Maximum entries to return (default 20)
        in: query
        name: limit
        type: integer
      - description: Restrict to one target type, e.g. node (requires target_id)
        in: query
        name: target_type
        type: string
      - description: Restrict to one target id (requires target_type)
        in: query
        name: target_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_proximavpn_proxima-vpn_api-server_internal_services.Entry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get recent activity
      tags:
      - admin-stats
  /admin/alerts/{id}:
    patch:
      consumes:
      - application/json
      description: Acknowledging removes an alert from the notifiable count while
        leaving it visible. Silencing suppresses notifications for a bounded window
        without stopping evaluation.
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      - description: Acknowledge flag or silence duration in minutes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.patchAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Acknowledge or silence an alert
      tags:
      - admin
  /admin/announcements:
    get:
      description: Returns all announcements for admin management
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.announcementItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List announcements
      tags:
      - admin-announcements
    post:
      consumes:
      - application/json
      description: Creates a new announcement shown in the user portal
      parameters:
      - description: Announcement to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createAnnouncementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.announcementItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create announcement
      tags:
      - admin-announcements
  /admin/announcements/{id}:
    delete:
      description: Deletes an announcement by ID
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete announcement
      tags:
      - admin-announcements
    put:
      consumes:
      - application/json
      description: Partially updates an announcement's fields
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateAnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.announcementItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update announcement
      tags:
      - admin-announcements
  /admin/auth/2fa/disable:
    post:
      consumes:
      - application/json
      description: Verify TOTP code and disable 2FA for the admin account
      parameters:
      - description: TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.disable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable 2FA
      tags:
      - admin-auth
  /admin/auth/2fa/enable:
    post:
      consumes:
      - application/json
      description: Verify TOTP code and enable 2FA for the admin account
      parameters:
      - description: Secret and TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.enable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enable 2FA
      tags:
      - admin-auth
  /admin/auth/2fa/setup:
    get:
      description: Generate a TOTP secret and otpauth URL for the admin to scan
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup 2FA
      tags:
      - admin-auth
  /admin/auth/2fa/status:
    get:
      description: Returns whether 2FA is enabled for the admin account
      produces:
      - application/json
      responses:
