        type: string
    type: object
  handlers.nodeListItem:
    properties:
      capacity:
        type: integer
      config_hash:
        type: string
      country:
        type: string
      cpu_usage:
        type: number
      created_at:
        type: string
      disk_usage:
        type: number
      firewall_ports:
        type: string
      firewall_preset:
        type: string
      id:
        type: string
      ip:
        type: string
      labels:
        additionalProperties:
          type: string
        description: |-
          Per-language names keyed by language code, populated by GetNode only;
          the list endpoint omits them rather than joining for every row.
        type: object
      last_ping_at:
        type: string
      last_seen:
        type: string
      load_avg:
        type: number
      max_concurrent_conns:
        type: integer
      memory_usage:
        type: number
      name:
        type: string
      network_in:
        type: number
      network_out:
        type: number
      online_devices:
        description: |-
          Device credentials live on this node now, against how many the plans
          pointing at it are entitled to place. Capacity is an entitlement ceiling,
          not a limit - nothing refuses a connection for exceeding it.
        type: integer
      os_family:
        type: string
      port:
        type: integer
      region:
        type: string
      shaping_error:
        type: string
      shaping_ok:
        description: |-
          Surfaces a node that cannot run tc: speed-limited plans on it are not
          actually limited, and nothing else about the node looks wrong.
        type: boolean
      shaping_tiers:
        type: integer
      status:
        type: string
      status_changed_at:
        description: When status last flipped; null for nodes that predate the column.
        type: string
      traffic_multiplier:
        description: Factor applied to this node's traffic when charging a user's
          quota.
        type: number
      updated_at:
        type: string
      xray_minimum:
        type: string
      xray_running:
        description: |-
          From the heartbeat: status only says the agent checked in, these say
          whether Xray is actually serving the published config.
        type: boolean
      xray_too_old:
        description: |-
          Set when the node's core predates the stats RPC the panel needs. Reported
          rather than refused: the node still carries traffic, and cutting it off
          over a version would be worse than telling the operator to upgrade it.
        type: boolean
      xray_version:
        type: string
      xray_version_warning:
        type: string
    type: object
