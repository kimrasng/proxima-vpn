basePath: /api/v1
definitions:
  github_com_proximavpn_proxima-vpn_api-server_internal_services.Alert:
    properties:
      count:
        type: integer
      kind:
        type: string
      severity:
        type: string
    type: object
  github_com_proximavpn_proxima-vpn_api-server_internal_services.Alerts:
    properties:
      evaluated_at:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_proximavpn_proxima-vpn_api-server_internal_services.Alert'
        type: array
      node_issues:
        items:
          $ref: '#/definitions/github_com_proximavpn_proxima-vpn_api-server_internal_services.NodeIssue'
        type: array
      pending_requests:
        type: integer
      total:
        description: |-
          Total counts only what an operator still has to look at: firing conditions
          that are neither acknowledged nor silenced. Stale rows are excluded because
          their readings are frozen, and pending approvals are excluded because they
          are a work queue rather than a system condition.
        type: integer
    type: object
  github_com_proximavpn_proxima-vpn_api-server_internal_services.Entry:
    properties:
      actor_id:
        type: string
      actor_label:
        type: string
      actor_type:
        type: string
      created_at:
        type: string
      detail:
        additionalProperties: {}
        type: object
      event_type:
        type: string
      id:
        type: string
      severity:
        type: string
      target_id:
        type: string
      target_type:
        type: string
    type: object
  github_com_proximavpn_proxima-vpn_api-server_internal_services.LoginEntry:
