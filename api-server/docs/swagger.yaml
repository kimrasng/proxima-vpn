      acked:
        type: boolean
      acked_by:
        type: string
      alert_id:
        description: |-
          Lifecycle fields, added when alerts became stateful. Additive on purpose:
          an older client that ignores unknown keys still reads the same response.
        type: string
      country:
        type: string
      duration_seconds:
        type: integer
      fired_at:
        type: string
      kind:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      region:
        type: string
      severity:
        type: string
      silenced_until:
