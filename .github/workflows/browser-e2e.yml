name: Browser E2E (admin panel + user portal)

# Playwright suite against a real api-server. It runs as its own workflow, not
# inside e2e.yml's data-plane job: the two fail for unrelated reasons and a slow
# browser failure must not time out the protocol tests.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'api-server/**'
      - 'pkg/**'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api-server/**'
      - 'pkg/**'
      - '.github/workflows/browser-e2e.yml'

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpnuser
          POSTGRES_PASSWORD: vpnpass
          POSTGRES_DB: vpnpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnuser -d vpnpanel"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://vpnuser:vpnpass@localhost:5432/vpnpanel
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-test-secret-not-for-production-use
      PANEL_URL: http://localhost:2053
      ADMIN_EMAIL: admin@e2e.test
      ADMIN_PASSWORD: E2ETestAdminPass123!
      SWAGGER_ENABLED: "false"
      ENABLE_TEST_EMAIL_CODE_LOOKUP: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            api-server/go.sum
            pkg/go.sum

      - name: Build api-server
        run: cd api-server && go build -o /tmp/api-server ./cmd

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Managed Entry DNS runs against an in-memory Cloudflare stub so relays get
      # an Entry hostname (node-chains.spec.ts) without the real API or token.
      - name: Start Cloudflare DNS stub
        run: |
          nohup node web/e2e/cloudflare-stub.mjs 18090 > /tmp/cloudflare-stub.log 2>&1 &
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://127.0.0.1:18090/ && exit 0
            sleep 1
          done
          cat /tmp/cloudflare-stub.log
          exit 1

      - name: Start api-server
        env:
          CLOUDFLARE_API_TOKEN: e2e-stub-token-not-a-real-credential
          CLOUDFLARE_ZONE_ID: 0123456789abcdef0123456789abcdef
          ENTRY_DNS_BASE_DOMAIN: entry.e2e.test
          CLOUDFLARE_API_BASE_URL: http://127.0.0.1:18090/client/v4
        run: |
          nohup /tmp/api-server > /tmp/api-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:2053/health > /dev/null && exit 0
            sleep 1
          done
          echo "api-server did not become healthy in time"
          cat /tmp/api-server.log
          exit 1

      # vite preview proxies /api and /sub to the api-server, mirroring what
      # nginx does in production.
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium

      - name: Build web
        run: cd web && npm run build

      - name: Run browser e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@e2e.test
          E2E_ADMIN_PASSWORD: E2ETestAdminPass123!
          ENABLE_TEST_EMAIL_CODE_LOOKUP: "true"
          VITE_API_PROXY_TARGET: http://localhost:2053
          CLOUDFLARE_API_TOKEN: e2e-stub-token-not-a-real-credential
          CLOUDFLARE_ZONE_ID: 0123456789abcdef0123456789abcdef
          ENTRY_DNS_BASE_DOMAIN: entry.e2e.test
          CLOUDFLARE_API_BASE_URL: http://127.0.0.1:18090/client/v4
        run: |
          cd web
          # Real API journeys get independent rate-limit budgets.
          restart_api() {
            api_pid=$(pgrep -x api-server)
            kill "$api_pid"
            for i in $(seq 1 30); do
              kill -0 "$api_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$api_pid" 2>/dev/null; then
              echo "old api-server did not exit"
              return 1
            fi
            nohup /tmp/api-server >> /tmp/api-server.log 2>&1 &
            for i in $(seq 1 30); do
              if curl -sf http://localhost:2053/health > /dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "isolated api-server did not become healthy"
            return 1
          }
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/main npx playwright test --project=user-portal --project=admin --retries=0 --output=test-results/main
          restart_api
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/admin-core npx playwright test --project=admin-core --retries=0 --output=test-results/admin-core
          restart_api
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/node-chains npx playwright test --project=node-chains --retries=0 --output=test-results/node-chains

      - name: Dump api-server log on failure
        if: failure()
        run: cat /tmp/api-server.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-logs
          path: |
            /tmp/api-server.log
            /tmp/cloudflare-stub.log
            web/playwright-report/**
            web/test-results/**
          if-no-files-found: ignore
          retention-days: 7
