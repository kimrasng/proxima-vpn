name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Postgres and Redis are provided so the DB- and Redis-backed tests actually
    # run instead of skipping themselves - they no-op unless TEST_DATABASE_URL /
    # TEST_REDIS_ADDR are set, and a skip is not a failure, so the online-tracker
    # tests passed as green while never executing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpnuser
          POSTGRES_PASSWORD: vpnpass
          POSTGRES_DB: vpnpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnuser -d vpnpanel"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://vpnuser:vpnpass@localhost:5432/vpnpanel
      # host:port, not a redis:// URL - this reaches redis.Options.Addr directly,
      # unlike the REDIS_URL the server itself parses.
      TEST_REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # go.work keeps each go.sum in a subdirectory; setup-go only looks at
          # the repo root, so caching silently failed as "file is not found".
          cache-dependency-path: |
            api-server/go.sum
            node-agent/go.sum
            pkg/go.sum
      - name: Build api-server
        run: cd api-server && go build ./...
      - name: Build node-agent
        run: cd node-agent && go build ./...
      - name: Build pkg
        run: cd pkg && go build ./...
      # The DB-backed tests exercise real tables, so the schema has to exist
      # first. Migrate() is idempotent and is what the server itself runs at
      # startup, so calling it directly applies exactly what production applies.
      #
      # This used to boot the server binary and rely on it dying when it could
      # not reach Redis. Adding a Redis service to this job removed that exit:
      # the server came up healthy and ran forever, hanging the step. Calling
      # the migration on its own has no such dependency.
      - name: Apply database schema
        env:
          DATABASE_URL: postgres://vpnuser:vpnpass@localhost:5432/vpnpanel
        run: cd api-server && go run ./cmd/migrate
      - name: Test api-server
        run: cd api-server && go test ./...
      - name: Test node-agent
        run: cd node-agent && go test ./...
      - name: Test pkg
        run: cd pkg && go test ./...

  # version is pinned (not "latest") because golangci-lint-action's "latest"
  # resolved to a binary built with an older Go toolchain than go.work's
  # `go 1.25.0`, which made every run fail immediately with "can't load
  # config: the Go language version ... is lower than the targeted Go
  # version" before it ever got to analyze any code (see git history: every
  # run from 2026-07-13 through 2026-08-26 failed this way). v2.13.1 is
  # built with go1.27 and has been verified locally against this repo.
  # The action is pinned to @v9, the release that moved off the deprecated
  # node20 runtime; it requires golangci-lint >= v2.1.0, which v2.13.1 meets.
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            api-server/go.sum
            node-agent/go.sum
            pkg/go.sum
      - name: golangci-lint (api-server)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: api-server
      - name: golangci-lint (node-agent)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: node-agent
      - name: golangci-lint (pkg)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: pkg

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      # Every server route lives under /api/v1. A call written as /api/... still
      # compiles, passes lint and looks right in review, then 404s only for
      # whoever exercises that one path - device deletion shipped that way.
      - name: Check API paths are versioned
        run: |
          set -o pipefail
          offenders=$(grep -rnoE "['\"\`]/api/[a-z0-9-]+" \
            --include='*.ts' --include='*.tsx' web/src \
            | grep -v "/api/v1" || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::API calls above are missing the /api/v1 prefix"
            exit 1
          fi
          echo "all API calls are versioned"
      - name: Build
        run: cd web && npm run build
