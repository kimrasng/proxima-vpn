[metadata]
exit_criteria = "[An order is persisted for every checkout attempt whether or not it is paid A payment event is recorded before business logic runs and a replay cannot grant twice An administrator confirmed route completes a purchase end to end and grants the plan A hosted provider completes a purchase end to end through the same state machine Unpaid orders expire on a schedule and a late confirmation is still honoured Adding a provider touches only its own implementation and its registration Verified by driving a real purchase and by replaying a payment callback]"
goal = "Complete a purchase that grants a plan exactly once"
order = 6.0

