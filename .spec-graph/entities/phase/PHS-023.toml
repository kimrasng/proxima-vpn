title = "Phase 6 - Checkout and payment provider abstraction"
description = "Builds order records, payment event recording, administrator managed checkout routes and the provider interface, proving the state machine with an administrator confirmed provider before integrating a hosted provider. Includes order expiry sweeping and the cheaply available request context fields."
