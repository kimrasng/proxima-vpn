title = "Account subscription resolves UUID slot by HMAC-keyed x-hwid fingerprint"
description = "api-server/internal/handlers/subscription_account.go: when x-hwid (10-64 printable ASCII) is present, an HMAC-SHA256 fingerprint is derived from the per-deployment pepper (hwid_secrets) and the raw header. The resulting slot is created on first registration (up to hwid_registration_cap) and reused on every subsequent refresh. Absent or invalid x-hwid falls back to the single shared account UUID."
