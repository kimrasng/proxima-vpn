title = "PaymentService.Settle order state machine"
description = "PaymentService.Settle(ctx, Confirmation) claims payment_events via idempotent INSERT ON CONFLICT keyed on (provider, external_id), claims plan_orders from pending or expired to paid, cross-checks AmountCents against the order's snapshotted price_cents, and grants the plan via PlanService.GrantPlanWithDuration. Reverts the order claim on amount mismatch or grant failure."
