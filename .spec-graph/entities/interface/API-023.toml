title = "POST /webhooks/payments/:provider receives provider callbacks"
description = "PaymentWebhookHandler.Receive looks up the provider in the registry, type-asserts WebhookVerifier, verifies the signed payload, and calls PaymentService.Settle on a non-nil confirmation. Always returns 200 except on signature failure or grant failure, matching Stripe's retry-until-2xx semantics. Exempted from the global rate limiter."
