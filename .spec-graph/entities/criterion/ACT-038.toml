schema = 1
id = "ACT-038"
type = "criterion"
title = "Entry node to exit node link can be managed from dashboard"
status = "draft"
created_at = 2026-09-25T21:32:30+09:00
updated_at = 2026-09-26T00:35:31+09:00

[metadata]
given = "A forwarding entry node and an exit node exist"
then = "The dashboard lists the selected entry and exit nodes and endpoints, persists subscription visibility, and can disable and delete the relayed link"
when = "An administrator creates a direct node link, assigns visibility groups, and changes enabled state"
