schema = 1
id = "DEC-022"
type = "decision"
title = "One-off prepaid purchases only; no auto-renewal"
description = "Plan purchases are one-off prepayments that extend a subscription term. No recurring billing, no stored payment mandates, no dunning. The payment channels available to this operator cannot support auto-renewal, so recurring billing is out of scope permanently rather than deferred."
status = "active"
created_at = 2026-09-20T14:54:20+09:00
updated_at = 2026-09-20T14:54:20+09:00

[metadata]
date = "2026-09-20"
rationale = "User confirmed the payment channel structure makes auto-renewal impossible. This removes subscription objects, off-session mandates and dunning from scope, and means the provider interface only needs one-shot payment creation."
