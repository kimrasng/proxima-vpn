schema = 1
id = "DEC-012"
type = "decision"
title = "Persist login attempts in a dedicated login_history table"
description = "Login attempts are written to a new login_history table rather than activity_logs, because attempts need a failure reason, a user agent, an outcome flag, and an indexed per-user query path that a generic JSONB event feed cannot serve efficiently. The existing activity_logs login event is kept so the global activity feed is unchanged."
status = "active"
created_at = 2026-09-19T21:31:06+09:00
updated_at = 2026-09-19T21:32:18+09:00

[metadata]
date = "2026-09-19"
rationale = "Attempt records need typed outcome, reason, user agent, and an indexed per-user lookup that the generic activity feed cannot provide."
