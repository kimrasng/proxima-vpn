schema = 1
id = "DEC-016"
type = "decision"
title = "Failed-login writes ride the existing login rate limiter and a bounded reason"
description = "Login attempt recording is placed behind the rate limiter that already guards the login route, and the stored failure reason is drawn from a fixed set of internal constants rather than from request-controlled text, bounding both row growth and stored content."
status = "active"
created_at = 2026-09-19T21:31:50+09:00
updated_at = 2026-09-19T21:32:18+09:00

[metadata]
date = "2026-09-19"
rationale = "The login route is already rate limited, so reusing that limit bounds append volume without new infrastructure; a fixed reason set prevents attacker-controlled content from entering the table."

[[relations]]
to = "RSK-006"
type = "mitigates"
