title = "Add a breadcrumb trail to the admin layout for detail pages"
description = "AdminLayout gains a breadcrumbs slot driven by the active route so a detail page can show the path from its list page. Placing it in the layout keeps every future detail page consistent instead of each page rendering its own trail."
