schema = 1
id = "DEC-008"
type = "decision"
title = "Evaluation runs inside the existing node_monitor sweep, not a new scheduler"
description = "The evaluator reads nodes.status, which the offline sweep writes in the same tick. Ordering them in one sweep removes the race a second scheduler would introduce."
status = "draft"
created_at = 2026-09-19T21:28:40+09:00
updated_at = 2026-09-19T21:28:40+09:00

[metadata]
kind = "architecture"
rationale = "A separate scheduler would let the alert list disagree with the node list for a full sweep interval."
status = "accepted"
