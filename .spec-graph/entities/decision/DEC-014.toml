type = "decision"
title = "The detail page owns user editing; the list keeps only quick state actions"
description = "Field editing moves entirely to the detail page. The list retains suspend and activate plus reset traffic as quick actions inside a dropdown, because those are single-click state changes that do not need a form."
status = "active"
created_at = 2026-09-19T21:31:06+09:00
updated_at = 2026-09-19T21:32:18+09:00

[metadata]
date = "2026-09-19"
rationale = "A modal cannot hold plan, traffic, device, and login-history context; quick state toggles do not warrant a page navigation."
