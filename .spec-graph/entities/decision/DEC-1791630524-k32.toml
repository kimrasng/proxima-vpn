schema = 1
id = "DEC-1791630524-k32"
type = "decision"
title = "Install per-device egress outbounds and rules live via Xray gRPC"
description = "Per-device egress topology (socks outbound device-egress-<uuid> and the field rule user=<uuid>@proxima to it) is treated as user-scoped, not structural, and applied with HandlerService AddOutbound/RemoveOutbound and RoutingService AddRule/RemoveRule using a per-device ruleTag. Any gRPC failure falls back to the existing safe restart path."
status = "draft"
created_at = 2026-10-10T20:08:44+09:00
updated_at = 2026-10-10T20:08:44+09:00

[metadata]
date = "2026-10-10"
rationale = "Restarting Xray for every new account drops every live session on the node; the user requires no restart."
