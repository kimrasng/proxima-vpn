schema = 1
id = "DEC-017"
type = "decision"
title = "Caller-supplied audit strings are truncated on a rune boundary"
description = "Both the user agent and the attempted email are cut to a byte ceiling that is walked back to the nearest rune start before insertion, and the attempted email is bounded like the user agent. This keeps a hostile or merely non-ASCII header from producing invalid UTF-8 that would reject the audit row, and bounds attacker-chosen row content."
status = "active"
created_at = 2026-09-19T22:29:57+09:00
updated_at = 2026-09-19T22:29:58+09:00

[metadata]
date = "2026-09-19"
rationale = "An audit row that a client can suppress is worse than no audit claim at all; rune-boundary truncation removes the suppression path while keeping rows bounded."

[[relations]]
to = "RSK-007"
type = "mitigates"
