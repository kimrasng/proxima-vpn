schema = 1
id = "DEC-020"
type = "decision"
title = "The detail page submits only changed fields"
description = "Saving compares the form against the last loaded user and sends only the differing fields, and the page is keyed on the route parameter so a different user remounts it with fresh state. A stale form therefore cannot revert someone else's change, and one user's values cannot be written to another."
status = "active"
created_at = 2026-09-19T22:38:17+09:00
updated_at = 2026-09-19T22:38:18+09:00

[metadata]
date = "2026-09-19"
rationale = "The update request is all-pointer and already supports partial updates, so a diff removes the revert without adding optimistic-locking machinery."

