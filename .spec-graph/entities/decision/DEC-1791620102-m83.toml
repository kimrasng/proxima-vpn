schema = 1
id = "DEC-1791620102-m83"
type = "decision"
title = "Detect concurrent devices on the server instead of relying on client x-hwid"
description = "Concurrent devices are detected only from what the servers observe: per account, the distinct client addresses holding live tunnel connections across all Exits. Relayed connections are attributed to the original client address the Entry recorded. Client-supplied identity (x-hwid or any header) is never read, not even as a hint."
status = "active"
created_at = 2026-10-10T17:15:02+09:00
updated_at = 2026-10-13T11:54:28+09:00

[metadata]
date = "2026-10-10"
rationale = "Client-supplied identity is absent in practice; server observation is the only signal every client produces."

