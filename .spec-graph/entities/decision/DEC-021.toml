schema = 1
id = "DEC-021"
type = "decision"
title = "login_history is swept by age like the other append-only tables"
description = "The retention scheduler prunes login_history on a longer window than the activity feed, because it is the audit trail an operator consults after the fact."
status = "active"
created_at = 2026-09-19T22:38:17+09:00
updated_at = 2026-09-19T22:38:18+09:00

[metadata]
date = "2026-09-19"
rationale = "An unauthenticated append path without a sweep is an unbounded disk-growth vector; the created_at index already existed to serve the prune."

