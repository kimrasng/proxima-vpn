schema = 1
id = "DEC-013"
type = "decision"
title = "Aggregate per-node user traffic from traffic_logs through devices"
description = "Per-user per-node traffic is computed by joining traffic_logs to devices on device_id and filtering by devices.user_id. No new table or denormalized counter is introduced, because traffic_logs already carries node_id and device_id per report."
status = "active"
created_at = 2026-09-19T21:31:06+09:00
updated_at = 2026-09-19T21:32:18+09:00

[metadata]
date = "2026-09-19"
rationale = "traffic_logs already records node_id and device_id, so the breakdown is a query concern rather than a storage concern."
