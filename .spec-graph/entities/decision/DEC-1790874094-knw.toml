title = "Use optional validated HWID for logical subscription identity"
description = "Validate x-hwid with the accepted 10-64 character ASCII format. Treat HWID as client-supplied logical installation identity, not physical-device attestation. Begin optional and retain legacy per-device subscriptions; strict missing-HWID rejection requires separate rollout approval."
