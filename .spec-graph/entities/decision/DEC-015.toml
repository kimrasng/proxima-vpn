title = "Reuse the established Cloudscape detail-page pattern for user detail"
description = "The user detail page follows the NodeDetail composition already in the codebase: ContentLayout with a Header, Grid rows of paired Containers, KeyValuePairs for identity, Table for tabular data, and the breadcrumb leaf published through usePublishBreadcrumbLeaf."
