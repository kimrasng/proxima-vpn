schema = 1
id = "DEC-029"
type = "decision"
title = "Entitlement-affecting plan attributes are frozen for live subscribers until grant snapshots exist"
description = "Plan grants continue to read entitlement values from the current plan row while grant-side snapshots are deferred. Until snapshots are implemented, administrators must create a replacement plan for entitlement-affecting changes instead of editing a plan that has live subscribers. This operational containment reduces the risk of retroactively changing purchased terms."
status = "active"
created_at = 2026-09-22T10:06:09+09:00
updated_at = 2026-09-22T10:06:09+09:00

[metadata]
date = "2026-09-22"
rationale = "Grant-side entitlement snapshots require a schema change and backfill. The interim policy prevents in-place edits to traffic allowance, device count, speed limit, and other purchased entitlements for active subscribers."

[[relations]]
to = "RSK-012"
type = "mitigates"
