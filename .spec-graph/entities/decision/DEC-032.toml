schema = 1
id = "DEC-032"
type = "decision"
title = "Cloudflare DNS is reconciled asynchronously from durable node intent"
description = "Use the fixed Cloudflare API with a zone-scoped DNS Write token supplied only through deployment secrets. Reconciliation is outside registration transactions, uses owned-record-only mutations, DNS-only records, redacted errors, and no token distribution to nodes, clients, logs, screenshots, or database rows. Existing names are frozen if zone or base-domain configuration changes."
status = "active"
created_at = 2026-09-29T20:09:10+09:00
updated_at = 2026-09-30T13:55:24+09:00

[metadata]
date = "2026-09-29"
rationale = "Durable asynchronous intent avoids partial registration failures and makes provider retries, ambiguous outcomes, and deletion cleanup recoverable."

[[relations]]
to = "RSK-014"
type = "mitigates"
