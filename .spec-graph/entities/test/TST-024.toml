title = "Promotion reservations, expiry release, and free-order settlement are verified"
description = "Database-backed automated tests cover conditional eligibility, overall and per-user caps under concurrent redemption, idempotent release, confirmation after settlement, release on expiry and administrator cancellation, and a 100% promotion that grants a plan through POST /user/orders without an external provider. Regression tests serialize promotion changes with cancellation and settlement on the order row, reject changes after a terminal transition, preserve the previous discount when replacement fails, reuse one ledger row without compounding discounts, prevent deadlock during concurrent opposite-code swaps, and reject a zero-amount promotion settlement when the current order total is nonzero."
