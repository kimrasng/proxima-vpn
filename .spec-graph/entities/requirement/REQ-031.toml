title = "Administrators manage multiple checkout routes backed by different payment providers"
description = "An administrator creates, orders, enables and disables checkout routes from a dedicated panel section. Each route names a payment provider implementation and carries its non-secret configuration, while its credentials are supplied out of band. Adding support for a further provider requires an isolated code change rather than modifications to order handling."
