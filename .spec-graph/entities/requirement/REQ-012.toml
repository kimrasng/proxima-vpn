type = "requirement"
title = "An operator can silence an active alert for a bounded window"
description = "A time-boxed silence on a firing or frozen alert suppresses notifications and removes it from the badge count without stopping evaluation. Silencing a node before it goes down is NOT supported: only alerts that already exist in a non-ok state carry an id the client can address."
