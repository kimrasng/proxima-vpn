id = "REQ-038"
type = "requirement"
title = "Each Entry node owns one managed Cloudflare DNS hostname"
description = "For every registered forwarding-capable Entry node with a valid IPv4 address, persist one stable hostname whose label contains at least 128 bits of cryptographic randomness. Publish an A record through Cloudflare with proxied=false and TTL 300, reuse that hostname for every chain on the Entry, and never use DNS or SNI as the Exit routing discriminator."
