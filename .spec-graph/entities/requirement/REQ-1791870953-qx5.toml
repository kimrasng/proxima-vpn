title = "Concurrent authenticated tunnel sessions are limited per account"
description = "Count distinct authenticated live tunnel connections across Exit nodes. Separate tunnel connections count separately even when they share the same source IP or account UUID; destination streams inside a tunnel do not count separately. x-hwid does not exist in the identity or admission model. This is a session cap, not a physical-device or distinct-address cap."
