id = "REQ-023"
type = "requirement"
title = "Node provisioning collects configuration before emitting an install command"
description = "An administrator adding a node first chooses the target operating system and fills in a form covering node name, country, region, traffic multiplier, maximum concurrent connections and the firewall ports to open. Only after that form is submitted does the panel produce the install command. The values entered are persisted with the pending node and must survive node registration rather than being overwritten by what the agent self-reports."
