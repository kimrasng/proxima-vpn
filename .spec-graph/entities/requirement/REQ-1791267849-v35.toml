type = "requirement"
title = "Frontend data tables size columns to labels and values without interactive resizing"
description = "Across admin and user data tables, columns should use readable intrinsic widths from headings and values instead of arbitrary cramped widths. Do not let users drag column dividers. Keep ordinary short cells on one line and provide horizontal scrolling at narrow widths; long unbounded payloads retain full-text affordances rather than making the table unmanageably wide."
