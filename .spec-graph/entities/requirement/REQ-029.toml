title = "Plan cards present derived entitlements and administrator authored feature bullets separately"
description = "Quantities that exist as plan attributes, such as traffic allowance, device count and speed limit, are rendered from those attributes so they cannot contradict the plan. Additional marketing bullets are authored by an administrator per language, each marked as included or excluded, and are ordered for display."
