title = "Node display names are translated per user language in subscription output"
description = "A node carries an administrator supplied display name for each supported panel language. Subscription content served to a user renders node names in that user account language, falling back to the default name when no translation exists. Translations are entered by an administrator in the panel and no machine translation service is involved."
