id = "REQ-1790874510-ky7"
type = "requirement"
title = "Single account subscription URL issues stable UUIDs from HWID"
description = "A valid x-hwid on GET /sub/{sub_token} identifies a logical client installation. Concurrent refreshes for the same HWID reuse one UUID; distinct concurrent HWIDs cannot exceed the separately configured registration cap (initial default 10). Invalid or missing HWID creates no record. Retain compatible legacy device-specific links and only retire inactive HWID records after an online/accounting safety check."
