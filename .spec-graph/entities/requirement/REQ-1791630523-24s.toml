type = "requirement"
title = "Admitting a new device does not restart Xray or drop existing sessions"
description = "When a new device UUID is added to an Exit, its per-device SOCKS egress outbound and its user routing rule are installed live through Xray gRPC (HandlerService.AddOutbound and RoutingService.AddRule) together with the VLESS user (AlterInbound), so existing connections on the node are not interrupted. Removal is symmetric. Xray restarts only for genuine structural changes."
