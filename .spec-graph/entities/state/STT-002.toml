title = "Managed Entry DNS lifecycle"
description = "Desired states progress from unconfigured to pending to ready or error, and explicit node deletion creates durable deleting intent until provider absence is observed. Offline nodes and chain deletion do not transition to deleting. New relayed publication requires ready; existing ready records remain usable during provider outages when the desired address is unchanged."
