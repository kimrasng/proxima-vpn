schema = 1
id = "RSK-012"
type = "risk"
title = "Plan attribute edits retroactively change entitlements of paying customers"
description = "Traffic allowance and other entitlements are read live from the plan row through the user plan reference, so editing a plan immediately changes the allowance of every subscriber mid term. Once terms are purchased this shifts what customers paid for. Snapshotting entitlements onto the grant is the eventual fix and is deliberately out of scope for now."
