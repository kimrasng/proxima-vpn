schema = 1
id = "RSK-007"
type = "risk"
title = "A crafted User-Agent could suppress its own audit row"
description = "Truncating a caller-supplied user agent on a byte boundary can split a multi-byte character, and Postgres rejects the whole insert for invalid UTF-8. Because the audit write deliberately swallows its error, a client sending a long non-ASCII user agent made its own login attempt vanish from the history."
