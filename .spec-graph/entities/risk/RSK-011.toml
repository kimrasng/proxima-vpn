schema = 1
id = "RSK-011"
type = "risk"
title = "Client address may be recorded as the proxy address"
description = "The api-server runs behind nginx inside Docker, so the observed client address can be the proxy rather than the real client unless trusted proxy handling and the forwarded header are configured. Existing login history records may already be affected. Audit and abuse correlation built on this field would be worthless until verified."
