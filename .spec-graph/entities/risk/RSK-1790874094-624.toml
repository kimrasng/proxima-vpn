title = "HWID-controlled UUID issuance can exclude unsupported clients or be reset"
description = "Applications without x-hwid cannot use strict intake, while a client-controlled HWID can be changed to request registrations. Compatibility, registration caps, retention, observation, and staged strict rollout mitigate rather than eliminate these risks."
